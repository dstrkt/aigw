services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
      - portal
    restart: unless-stopped

  gateway:
    build: ./gateway
    expose:
      - "4000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://gateway:secret@postgres:5432/gateway_db
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GROQ_API_KEY=${GROQ_API_KEY}
      #- GROQ_API_KEY=${GROQ_API_KEY}
      - ASSISTANT_ID=e93ab496-9613-4d7c-b1ba-a9446373d12c
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - /tmp/aigw-uploads:/tmp/aigw-uploads
      - uploads:/tmp/uploads
  portal:
    build: ./portal
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_GATEWAY_URL=http://localhost/v1
      - DATABASE_URL=postgresql://gateway:secret@postgres:5432/gateway_db
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ASSISTANT_ID=e93ab496-9613-4d7c-b1ba-a9446373d12c
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - GATEWAY_INTERNAL_URL=http://gateway:4000
    depends_on:
      - gateway
    restart: unless-stopped

  worker:
    build: ./gateway
    command: sh -c "cd /app && celery -A app.worker worker --loglevel=info --concurrency=4"
    environment:
      - DATABASE_URL=postgresql+asyncpg://gateway:secret@postgres:5432/gateway_db
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
#      - redis
 #     - postgres
    restart: unless-stopped
    volumes:
      - /tmp/aigw-uploads:/tmp/aigw-uploads
      - uploads:/tmp/uploads

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: gateway_db
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway_db"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    expose:
      - "6333"
    volumes:
      - ./qdrant-storage:/qdrant/storage
    restart: unless-stopped

volumes:
  redis-data:
  uploads:
